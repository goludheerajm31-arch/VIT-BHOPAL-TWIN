<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VIT Bhopal Digital Twin</title>
    <meta name="description" content="One VIT Bhopal. One digital experience. Campus exploration, interactive map, navigation, live events, faculty cabin directory & indoor locator, verified publishers, and smart digital twin layer." />
    <meta property="og:title" content="VIT Bhopal Digital Twin" />
    <meta property="og:description" content="One VIT Bhopal. One digital experience. Campus exploration, interactive map, navigation, live events, faculty cabin directory & indoor locator, verified publishers, and smart digital twin layer." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Ignore WebSocket and HMR errors in iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#F5F5F7] text-[#1D1D1F] antialiased selection:bg-[#0071E3] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
